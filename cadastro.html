<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastrar | Jônatas Melo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

<div class="auth-card">
  <a href="index.html" class="auth-back">← Voltar ao site</a>
  <h1 class="auth-title">JÔNATAS <span class="text-red">MELO</span></h1>
  <p class="auth-subtitle">Crie seu perfil para acessar a área do aluno</p>

  <!-- FORMULÁRIO DE CADASTRO -->
  <form id="signupForm" class="auth-form">
    <label for="nome">Nome Completo</label>
    <input type="text" id="nome" required placeholder="Digite seu nome">

    <label for="email">E-mail</label>
    <input type="email" id="email" required autocomplete="email" placeholder="seu-email@exemplo.com">

    <label for="senha">Senha</label>
    <input type="password" id="senha" required autocomplete="new-password" placeholder="Crie uma senha">

    <button type="submit" class="auth-submit">Criar Conta</button>
  </form>

  <!-- LINK PARA MUDAR PARA LOGIN -->
  <p class="auth-switch" style="text-align: center; margin-top: 1rem; color: #fff;">
    Já tem uma conta? <a href="login.html" style="color: #ff0000; font-weight: bold; text-decoration: underline;">Faça login</a>
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/cadastro.js"></script>
</body>
</html>
