<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar | Jônatas Melo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

<div class="auth-card">
  <a href="index.html" class="auth-back">← Voltar ao site</a>
  <h1 class="auth-title">JÔNATAS <span class="text-red">MELO</span></h1>
  <p class="auth-subtitle">Entre com suas credenciais abaixo</p>

  <!-- FORMULÁRIO DE LOGIN -->
  <form id="loginForm" class="auth-form">
    <label for="email">E-mail</label>
    <input type="email" id="email" required autocomplete="email">

    <label for="senha">Senha</label>
    <input type="password" id="senha" required autocomplete="current-password">

    <button type="submit" class="auth-submit">Entrar</button>
    <p id="authError" class="auth-error" hidden></p>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
